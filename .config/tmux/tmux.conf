######################################################
##########          CONFIG               #############
######################################################

# True color support
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ',xterm-kitty:RGB'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # undercurl color support

# Enable mouse
set -g mouse on

# Allow passthrough
set -gq allow-passthrough on

# This is apparently necessary for a terminal's "focus" events to get passed
# through. This is required, for example, for neovim's `FocusGained` event to
# fire.
set -g focus-events on

# Set history limit ridiculously high.
set -g history-limit 1073741824

# Don't add any delay for pressing the escape key.
# Without this, vim becomes *really* annoying to use.
# The default is 500ms. Reduce it substantially.
set -s escape-time 20

# Start window numbering at 1.
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Rename window to reflect current program
setw -g automatic-rename on

# Renumber windows when a window is closed
set -g renumber-windows on

# Skip "kill-pane 1? (y/n)" prompt
bind-key x kill-pane

# Don't exit from tmux when closing a session
set -g detach-on-destroy off

# Use vim keybindings in copy mode
set -wg mode-keys vi

# Bind v to begin selection, y to copy selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Use saner splitting commands.
unbind %
unbind '"'
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# Start new pans in the same working directory
unbind c
bind c new-window -c "#{pane_current_path}"

# Bind meta to resize windows
bind -n M-h resize-pane -L 5
bind -n M-l resize-pane -R 5
bind -n M-k resize-pane -U 5
bind -n M-j resize-pane -D 5

# Reload tmux config binding
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Increase history limit
set -g history-limit 10000

######################################################
##########          Sesh                 #############
######################################################

bind-key C-f run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 90%,80% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:50%' \
    --preview 'sesh preview {}'
)\""

######################################################
##########          Statusbar            #############
######################################################

# Gruvbox Material Medium palette
set -g @gruvbox_background "#282828"
set -g @gruvbox_foreground "#dfbf8e"
set -g @gruvbox_black "#1d2021"
set -g @gruvbox_border "#665c54"
set -g @gruvbox_red "#ea6962"
set -g @gruvbox_green "#a9b665"
set -g @gruvbox_accent "#e78a4e"
set -g @gruvbox_accent_bright "#d8a657"

set -g status-interval 1
set -g status-style "bg=#{@gruvbox_background},fg=#{@gruvbox_foreground}"
set -g status-position top
set -g status-justify left
set -g status-left-length 60

setw -g window-status-style "bg=#{@gruvbox_background},fg=#{@gruvbox_foreground}"
setw -g window-status-current-style "bg=#{@gruvbox_accent},fg=#{@gruvbox_black},bold"
setw -g window-status-separator " "
setw -g window-status-format " #I: #W "
setw -g window-status-current-format " #I: #W "

set -g pane-border-style "fg=#{@gruvbox_border}"
set -g pane-active-border-style "fg=#{@gruvbox_accent_bright}"

set -g message-style "bg=#{@gruvbox_black},fg=#{@gruvbox_foreground}"
set -g message-command-style "bg=#{@gruvbox_black},fg=#{@gruvbox_foreground}"
set -g prompt-cursor-colour "#{@gruvbox_foreground}"

setw -g copy-mode-match-style "bg=#{@gruvbox_green},fg=#{@gruvbox_black}"
setw -g copy-mode-current-match-style "bg=#{@gruvbox_green},fg=#{@gruvbox_black}"

set -g status-left "#{?client_prefix,#[bg=#{@gruvbox_accent_bright}],#[bg=#{@gruvbox_red}]}#[fg=#{@gruvbox_black},bold] #S #[bg=#{@gruvbox_background},fg=#{@gruvbox_foreground}]"
set -g status-right "#[bg=#{@gruvbox_background},fg=#{@gruvbox_foreground}] %H:%M #[bg=#{@gruvbox_red},fg=#{@gruvbox_black},bold] %Y-%m-%d "

######################################################
##########          PLUGINS              #############
######################################################

set -g @plugin 'tmux-plugins/tpm' 
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Persists tmux environment across system restarts
set -g @plugin 'tmux-plugins/tmux-continuum'    # Continuous saving of tmux environment, automatic restore
set -g @plugin 'christoomey/vim-tmux-navigator' # Navigate between vim and tmux
set -g @plugin 'wfxr/tmux-fzf-url'              # open URL's in terminal with default browser

# Save and restore nvim
set -g @resurrect-processes '"~nvim" opencode ssh'

# Enable automatic restore
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
